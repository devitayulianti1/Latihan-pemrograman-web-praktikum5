<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block, Inline, dan Inline-Block</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h2 {
      margin-top: 30px;
    }

    .kotak-block {
      display: block;
      background-color: #ffd6d6;
      height: 40px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .kotak-inline {
      display: inline;
      background-color: #d6e8ff;
      width: 200px;
      height: 80px;
      padding: 10px;
      margin: 20px;
    }

    .kotak-inline-block {
      display: inline-block;
      background-color: #d6ffd6;
      width: 150px;
      height: 40px;
      padding: 10px;
      margin: 10px;
    }
  </style>
</head>
<body>

  <h2>1. Block</h2>
  <div class="kotak-block">Block 1</div>
  <div class="kotak-block">Block 2</div>

  <h2>2. Inline</h2>
  <span class="kotak-inline">Inline 1</span>
  <span class="kotak-inline">Inline 2</span>

  <h2>3. Inline-block</h2>
  <div class="kotak-inline-block">Inline-block 1</div>
  <div class="kotak-inline-block">Inline-block 2</div>

</body>
</html>
