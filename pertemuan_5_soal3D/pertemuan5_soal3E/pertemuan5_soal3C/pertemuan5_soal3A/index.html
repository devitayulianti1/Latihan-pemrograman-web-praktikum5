<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Content-box dan Border-box</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .kotak {
      width: 300px;
      padding: 25px;
      border: 5px solid navy;
      background-color: lightblue;
      margin-bottom: 20px;
    }

    .kotak1 {
      box-sizing: content-box;
    }

    .kotak2 {
      box-sizing: border-box;
    }

    .isi {
      background-color: steelblue;
      color: white;
      height: 40px;
      text-align: center;
      line-height: 40px;
    }
  </style>
</head>
<body>

  <h3>Kotak 1 (content-box)</h3>
  <div class="kotak kotak1">
    <div class="isi">Isi</div>
  </div>

  <h3>Kotak 2 (border-box)</h3>
  <div class="kotak kotak2">
    <div class="isi">Isi</div>
  </div>

</body>
</html>
